spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?user=postgres.aphjsebfulpmazdfhwnz&password=m86HsuVxH9K8HdNN&sslmode=require}
    username: ${DB_USERNAME:postgres.aphjsebfulpmazdfhwnz}
    password: ${DB_PASSWORD:m86HsuVxH9K8HdNN}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    locations: classpath:db/migration/core,classpath:db/migration/dev
    out-of-order: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  jwt:
    secret: ${JWT_SECRET:7a9f3c2e8b1d6f4a0e5c9b7d3f1a8e6c2b4d7f9a1c3e5b8d0f2a4c6e8b1d3f56}

  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
      - https://selectionsure.vercel.app

  code-exec:
    timeout-seconds: 10
    work-dir: /tmp/code_exec
    memory-limit: 128m
    cpu-limit: "0.5"

  verification:
    token:
      expiry-hours: 24

  rate-limit:
    register:
      capacity: 5
      refill-hours: 1